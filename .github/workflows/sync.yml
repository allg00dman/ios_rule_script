name: Sync rule from upstream

on:
  schedule:
    - cron: '0 2 * * *'   # UTC 02:00 = 北京时间 10:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/blackmatrix7/ios_rule_script.git
          git fetch --depth=1 upstream master

      - name: Sync rule/ (all formats)
        run: |
          rm -rf rule
          git checkout upstream/master -- rule

      - name: Sanity check
        run: |
          for d in AdGuard Clash Loon QuantumultX Shadowrocket Surge; do
            test -d "rule/$d" || { echo "missing rule/$d"; exit 1; }
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "sync rule $(date +'%Y-%m-%d')"
          git push
